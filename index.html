<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安興租車預約/詢價 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears&libraries=places&callback=initMapAutocomplete"></script>
    <style>
        :root { --primary: #553f62; --secondary: #9ca3af; --accent: #f07cad; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .ui-flow-v2 { background: #f6f3f7; color: #172033; }
        .top-brand { position: sticky; top: 0; z-index: 30; width: min(430px, 100%); margin: 0 auto; background: rgba(255, 255, 255, .96); border-bottom: 1px solid #e7dde8; padding: 14px 16px 12px; backdrop-filter: blur(10px); }
        .brand-title { color: #1A0B3D; font-size: 17px; font-weight: 700; }
        #formContainer { max-width: 430px; margin-top: 0; background: #fff; min-height: 100vh; box-shadow: 0 0 0 1px rgba(85, 63, 98, .08); }
    </style>
</head>
<body class="pb-10 ui-flow-v2">
    <div class="top-brand">
        <h1 class="brand-title">安興租車︱詢價/預約系統</h1>
    </div>

    <div id="formContainer" class="max-w-2xl mx-auto mt-4 px-4 hidden">
        <form id="bookingForm" class="space-y-6">
            <!-- Form content goes here -->
        </form>
    </div>

    <script>
        const APP_VERSION = "v1.9.50";
        const GAS_URL = "https://script.google.com/macros/s/AKfycby9KWdatRfDZY5g2DkieUkAhyEJDDCnKcMb_l8o2_J4JCaOtKYfEEkvzk-1sW-oZWIF/exec";

        // 地圖初始化回調
        window.initMapAutocomplete = function() {
            console.log("Maps API Ready");
            // 初始化邏輯...
        };

        window.onload = function() {
            console.log("System initialized, version: " + APP_VERSION);
            // 隱藏 loading
            const loading = document.getElementById('loading');
            if(loading) loading.style.display = 'none';
        };
    </script>
</body>
</html>
